[package]
name = "omma"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Turn an image into structured text an AI agent can reason about"
license = "MIT OR Apache-2.0"
readme = "README.md"
categories = ["command-line-utilities", "multimedia::images"]
keywords = ["ocr", "image", "mcp", "llm", "cli"]

[lib]
name = "omma"
path = "src/lib.rs"

[[bin]]
name = "omma"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
rmcp = { version = "3.9.0", features = ["transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "io-util", "macros"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.1", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
serde_json = "1.0.154"
