# OMMA configuration — every key is optional; these are the defaults.
# Location: $XDG_CONFIG_HOME/omma/config.toml or ~/.config/omma/config.toml

[general]
default_format = "text"
max_file_size_mb = 32
max_pixels = 40000000
max_dimension = 16384
max_alloc_mb = 256

[ocr]
enabled = true
languages = ["eng"]
timeout_seconds = 30
upscale_small_crops = true
small_crop_height = 120
upscale_factor = 4
min_confidence = 40.0

[colors]
enabled = true
max_colors = 6
grid_width = 64
grid_height = 36
quantization_bits = 5

[layout]
enabled = true

# Optional local vision model. Any OpenAI-compatible server works:
#   Ollama        http://127.0.0.1:11434/v1/chat/completions
#   llama.cpp     http://127.0.0.1:8080/v1/chat/completions
#   LM Studio     http://127.0.0.1:1234/v1/chat/completions
[vision]
enabled = false
endpoint = "http://127.0.0.1:11434/v1/chat/completions"
model = ""
timeout_seconds = 120
max_tokens = 400
allow_remote = false
# Longest side uploaded to the model; larger images are downscaled first.
max_image_dimension = 1280
max_request_mb = 6
# Name of an environment variable holding the API key: the config then contains
# no secret. api_key = "..." (a 0600 file) and OMMA_VISION_API_KEY still work.
# api_key_env = "ZAI_API_KEY"
# Optional provider thinking budget: none|minimal|low|medium|high|max.
# reasoning_effort = "max"

# Restrict which paths the MCP server may read. Empty means any path this
# process can read — fine for a single-user desktop, wrong for anything shared.
[mcp]
allowed_directories = []

[logging]
level = "warn"
